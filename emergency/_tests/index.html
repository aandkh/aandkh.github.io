<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>running</title>
  <style>
    body { margin: 0; padding: 20px; background: #0B0D12; color: #EEF0F4; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    #summary { font-size: 15px; font-weight: 700; margin: 0 0 12px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { white-space: pre-wrap; padding: 2px 0; }
    .pass { color: #7EE8B0; }
    .fail { color: #FF8A98; }
  </style>
</head>
<body>
  <h1>Chill · logic tests</h1>
  <p id="summary">running…</p>
  <ul id="results"></ul>
  <script type="module">
    import { runAll } from "./run.js";
    try {
      await import("./logic.test.js");
    } catch (err) {
      document.getElementById("summary").textContent = "could not load the tests: " + err.message;
      document.getElementById("summary").className = "fail";
      document.title = "FAIL";
      window.__results = { passed: 0, failed: 1, failures: [{ name: "load", error: err.message }] };
      throw err;
    }
    await runAll();
  </script>
</body>
</html>
