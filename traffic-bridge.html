<script>// Loaded only in an opaque-origin sandbox. No user data, credentials or map state.
(()=>{
 'use strict';
 if(window.parent===window)return;

 if(!['0','5','9'].includes(layer)||!/^[a-f0-9-]{36}$/i.test(token||''))return;

 const timer=setTimeout(()=>finish(false),20000);

  callback='andymapTrafficResponse_'+offset;script=document.createElement('script');
  window[callback]=data=>{
   if(finished)return;
