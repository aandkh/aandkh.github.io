    .page { width:100%; }

    .hitbox-download { left:27.6%; top:87.2%; width:45.4%; height:9.4%; }

    .download-side { text-align:center; }

    .trust-list li::before { content:"✓"; margin-right:9px; color:#85e59a; font-weight:700; }
    .description-side { text-align:center; }
    .game-description { margin:0; color:#ddd5ea; font-size:clamp(17px,3vw,24px); line-height:1.45; text-align:center; }
    .release-badges { display:flex; justify-content:center; align-items:flex-start; gap:18px; margin-top:18px; flex-wrap:wrap; }
    .release-badge { display:inline-flex; flex-direction:column; align-items:center; gap:6px; color:#ddd5ea; text-decoration:none; font-size:11px; font-weight:700; letter-spacing:.02em; min-width:48px; }
    .release-badge svg { width:30px; height:30px; display:block; flex:none; }
    .release-badge:hover { color:#fff; }
    .screenshots { width:100%; overflow-x:auto; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; padding:clamp(18px,3vw,32px) 0 28px; scrollbar-color:#ff5b18 #080015; }
    .screenshots-track { display:flex; width:max-content; gap:clamp(10px,1.6vw,18px); padding:0 clamp(12px,3vw,36px); margin:0 auto; }
    .screenshots img { display:block; flex:0 0 auto; width:min(86vw,760px); aspect-ratio:16/9; object-fit:cover; border:1px solid rgba(255,91,24,.55); box-shadow:0 0 24px rgba(255,91,24,.22); }
    @media (max-width:620px) {
      .info-columns { grid-template-columns:1fr 1fr; gap:16px; }
      .trust-list { font-size:11px; gap:6px; }
      .game-description { font-size:15px; }
      .release-badges { gap:11px; margin-top:13px; }
      .release-badge { font-size:9px; min-width:38px; }
      .release-badge svg { width:23px; height:23px; }
    }
  </style>
</head>
