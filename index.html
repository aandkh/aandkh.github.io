<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Page Through Time II</title>
  <style>
    html, body { margin:0; min-height:100%; background:#000; color:#f4f0ff; font-family:Arial,Helvetica,sans-serif; }
    body { min-height:100svh; overflow-x:hidden; }
    .page { width:100%; }
    .splash { position:relative; width:min(80vw,120vh); margin:0 auto; aspect-ratio:3/2; }
    .splash img { display:block; width:100%; height:100%; object-fit:contain; }
    .hitbox { position:absolute; display:block; text-indent:-9999px; overflow:hidden; background:transparent; outline:none; }
    .hitbox-download { left:27.6%; top:87.2%; width:45.4%; height:9.4%; }
    .download-info { width:min(86vw,760px); box-sizing:border-box; margin:clamp(8px,1.6vw,18px) auto 0; padding:clamp(18px,3vw,30px); background:linear-gradient(180deg,rgba(23,14,43,.96),rgba(8,5,18,.96)); border:1px solid rgba(255,91,24,.58); box-shadow:0 0 28px rgba(255,91,24,.16); }
    .download-info h1 { margin:0 0 6px; font-size:clamp(22px,4vw,34px); line-height:1.1; text-align:center; }
    .download-meta { margin:0 0 18px; color:#c8bedc; font-size:clamp(14px,2.4vw,17px); text-align:center; }
    .info-columns { display:grid; grid-template-columns:1fr 1fr; gap:clamp(22px,5vw,56px); align-items:center; }
    .download-side { text-align:center; }
    .trust-list { display:inline-grid; gap:8px; margin:0; padding:0; text-align:left; list-style:none; color:#ddd5ea; font-size:clamp(13px,2.2vw,16px); }
    .trust-list li::before { content:"✓"; margin-right:9px; color:#85e59a; font-weight:700; }
    .game-description { margin:0; color:#ddd5ea; font-size:clamp(17px,3vw,24px); line-height:1.45; text-align:center; }
    .screenshots { width:100%; overflow-x:auto; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; padding:clamp(18px,3vw,32px) 0 28px; scrollbar-color:#ff5b18 #080015; }
    .screenshots-track { display:flex; width:max-content; gap:clamp(10px,1.6vw,18px); padding:0 clamp(12px,3vw,36px); margin:0 auto; }
    .screenshots img { display:block; flex:0 0 auto; width:min(86vw,760px); aspect-ratio:16/9; object-fit:cover; border:1px solid rgba(255,91,24,.55); box-shadow:0 0 24px rgba(255,91,24,.22); }
    @media (max-width:620px) {
      .info-columns { grid-template-columns:1fr 1fr; gap:16px; }
      .trust-list { font-size:11px; gap:6px; }
      .game-description { font-size:15px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="splash" aria-label="A Page Through Time II download">
      <img src="images/SPLASH.png" alt="A Page Through Time II">
      <a class="hitbox hitbox-download" href="https://github.com/aandkh/aandkh.github.io/releases/download/v1.1.0/PageThroughTime2.zip" download aria-label="Click to download"></a>
    </section>
    <section class="download-info" aria-label="Download information">
      <h1>A Page Through Time 2</h1>
      <p class="download-meta">Free Windows game • ~200 MB</p>
      <div class="info-columns">
        <div class="download-side">
          <ul class="trust-list">
            <li>Hosted on GitHub Releases</li>
            <li>No installer — portable game</li>
            <li>No account required</li>
            <li>SHA-256 checksum available</li>
          </ul>
        </div>
        <p class="game-description">A side scrolling building smasher with surprise musical guests and more!</p>
      </div>
    </section>
    <section class="screenshots" aria-label="Gameplay screenshots">
      <div class="screenshots-track">
        <img src="images/screenshot-2.png" alt="Gameplay screenshot showing the blessing selection screen">
      </div>
    </section>
  </main>
</body>
</html>
