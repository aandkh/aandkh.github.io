<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Six Degrees of AndrewHanes.com</title>
  <style>
    :root { --bg:#060b1b; --bg2:#0b1538; --panel:rgba(255,255,255,.09); --border:rgba(255,255,255,.18); --text:#e6efff; --muted:#b6c8ee; --accent:#85d3ff; --ok:#98f5d6; --bad:#ff9ab0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--text); font-family:Inter,Segoe UI,Arial,sans-serif;
      background:radial-gradient(circle at 15% -10%, rgba(100,149,255,.27), transparent 35%),radial-gradient(circle at 90% 15%, rgba(108,213,255,.2), transparent 30%),linear-gradient(155deg, var(--bg) 0%, var(--bg2) 48%, #16124a 100%); }
    .wrap { max-width:1020px; margin:0 auto; padding:24px 16px 40px; }
    .glass { background:var(--panel); border:1px solid var(--border); border-radius:16px; backdrop-filter:blur(10px); }
    h1 { margin:8px 0 0; font-size:clamp(1.8rem,4.6vw,3rem); }
    .muted { color:var(--muted); }
    .actions { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
    button, input { border-radius:12px; border:1px solid var(--border); background:rgba(12,20,48,.55); color:var(--text); }
    button { cursor:pointer; padding:10px 14px; font-weight:600; }
    button.primary { background:linear-gradient(180deg,#bde8ff,#84d3ff); color:#122036; border:0; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .top { display:grid; grid-template-columns:1fr; gap:12px; margin-top:14px; }
    @media(min-width:780px){ .top { grid-template-columns:1fr 1fr; } }
    .card { padding:14px; }
    .head { display:flex; gap:12px; align-items:center; }
    .head img { width:74px; height:74px; border-radius:999px; object-fit:cover; border:1px solid rgba(255,255,255,.3); }
    .name { font-weight:700; font-size:1.1rem; }
    .chain { margin-top:16px; display:grid; gap:10px; }
    .movie, .actor { padding:10px; display:flex; gap:10px; align-items:center; }
    .movie img { width:52px; height:74px; border-radius:8px; object-fit:cover; }
    input { width:100%; padding:12px; }
    .suggestions { display:grid; gap:8px; margin-top:10px; max-height:280px; overflow:auto; }
    .suggestion { padding:8px; display:flex; gap:10px; align-items:center; cursor:pointer; }
    .suggestion img { width:42px; height:42px; border-radius:999px; object-fit:cover; }
    .status { margin-top:10px; color:var(--accent); font-weight:600; }
    .error { color:var(--bad); }
    .ok { color:var(--ok); }
    .compact { font-size:.9rem; }
    a { color:#bde8ff; text-decoration:none; }
    .path { margin-top:10px; padding:10px; border-radius:12px; border:1px dashed rgba(255,255,255,.25); }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="../index.html">← Back</a>
    <h1>Six Degrees of AndrewHanes.com</h1>
    <p class="muted">Connect Actor A to Actor B through shared movies.</p>

    <div class="actions">
      <button data-diff="easy">Easy</button>
      <button data-diff="medium" class="primary">Medium</button>
      <button data-diff="hard">Hard</button>
      <button id="new-match" style="margin-left:auto">New matchup</button>
    </div>

    <div class="top">
      <div class="glass card" id="source-card"></div>
      <div class="glass card" id="target-card"></div>
    </div>

    <div id="chain" class="chain"></div>

    <div class="glass card" style="margin-top:14px">
      <input id="actor-input" placeholder="Add next actor" autocomplete="off" />
      <div class="actions" style="margin-top:10px">
        <button id="use-top" class="primary" disabled>Use top match</button>
        <button id="show-shortest" disabled>Show shortest path</button>
      </div>
      <div id="suggestions" class="suggestions"></div>
      <div id="status" class="status">Ready.</div>
      <div id="path" class="path compact muted" style="display:none"></div>
    </div>
  </div>

  <script src="six_degrees_andrewhanes.js"></script>
</body>
</html>
