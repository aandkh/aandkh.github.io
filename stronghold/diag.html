<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stronghold — connection check</title>
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 18px 14px 60px;
    background: #12100b; color: #ddd0b6;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 19px; margin: 0 0 4px; color: #e0bb55; letter-spacing: .04em; }
  p.sub { margin: 0 0 18px; color: #a29174; font-size: 13.5px; }
  .t {
    border: 1px solid #3b3122; border-radius: 4px;
    padding: 11px 12px; margin-bottom: 10px; background: #1a150e;
  }
  .t h2 { margin: 0 0 5px; font-size: 13px; letter-spacing: .1em;
          text-transform: uppercase; color: #a29174; font-weight: 600; }
  .v { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
       word-break: break-all; white-space: pre-wrap; }
  .ok   { color: #9fd07a; }
  .bad  { color: #ef8f78; }
  .wait { color: #a29174; }
  button {
    display: block; width: 100%; margin: 16px 0 0; padding: 14px;
    background: #33270f; color: #e6c368; border: 1px solid #8a6f2e;
    border-radius: 3px; font-size: 15px; letter-spacing: .1em;
    text-transform: uppercase; cursor: pointer;
  }
  textarea {
    width: 100%; height: 190px; margin-top: 12px; padding: 9px;
    background: #0d0a06; color: #ddd0b6; border: 1px solid #3b3122;
    border-radius: 3px; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
  }
  a { color: #b39a63; }
</style>
</head>
<body>

<h1>Connection check</h1>
<p class="sub">This page talks to the game server four different ways and
reports exactly which ones work. Nothing is created and nothing is signed
into. Send the result back and it will say where the break is.</p>

<div id="tests"></div>

<button id="copy">Copy the result</button>
<textarea id="out" readonly></textarea>

<p style="margin-top:18px"><a href="index.html">back to the gate</a></p>

<script>
(function () {
  var API = "https://aandkh-stronghold.fly.dev";
  var box = document.getElementById("tests");
  var log = [];

  function card(name) {
    var d = document.createElement("div");
    d.className = "t";
    d.innerHTML = '<h2>' + name + '</h2><div class="v wait">running…</div>';
    box.appendChild(d);
    return d.querySelector(".v");
  }
  function done(el, ok, text) {
    el.className = "v " + (ok ? "ok" : "bad");
    el.textContent = (ok ? "OK  " : "FAIL  ") + text;
    log.push((ok ? "OK   " : "FAIL ") + el.parentNode.querySelector("h2").textContent
             + " :: " + text);
    document.getElementById("out").value = log.join("\n");
  }

  // What the browser thinks it is, before any network happens at all.
  var e = card("Where this page is");
  var where = [
    "url      " + location.href,
    "origin   " + location.origin,
    "protocol " + location.protocol,
    "agent    " + navigator.userAgent
  ].join("\n");
  e.className = "v";
  e.textContent = where;
  log.push(where);

  function run(name, fn) {
    var el = card(name);
    return fn().then(function (msg) { done(el, true, msg); })
               .catch(function (err) { done(el, false, (err && err.message) || String(err)); });
  }

  // 1. Plainest possible request: no custom header, so the browser does
  //    NOT send a preflight first. If this works and the others do not,
  //    the problem is the preflight, not the network.
  run("1. Simple GET, no preflight", function () {
    return fetch(API + "/api/health", { mode: "cors" })
      .then(function (r) { return r.text().then(function (t) {
        return "http " + r.status + "  " + t.slice(0, 70); }); });
  })
  // 2. Same request, but with the X-Token header the game always sends.
  //    That header is what forces a preflight.
  .then(function () {
    return run("2. GET with X-Token (forces preflight)", function () {
      return fetch(API + "/api/honours", { mode: "cors", headers: { "X-Token": "" } })
        .then(function (r) { return r.text().then(function (t) {
          return "http " + r.status + "  " + t.slice(0, 70); }); });
    });
  })
  // 3. The actual sign-in shape: POST, JSON body, preflight. Deliberately
  //    wrong details, so it can only ever come back "does not match".
  .then(function () {
    return run("3. POST sign-in (what fails for you)", function () {
      return fetch(API + "/api/login", {
        method: "POST", mode: "cors",
        headers: { "Content-Type": "application/json", "X-Token": "" },
        body: JSON.stringify({ username: "diag-nobody", password: "zzzzzz" })
      }).then(function (r) { return r.text().then(function (t) {
        return "http " + r.status + "  " + t.slice(0, 90); }); });
    });
  })
  // 4. Can this device reach the host at all, ignoring CORS entirely?
  //    An opaque response means the packets get there and something
  //    about the cross-origin rules is the blocker, not the connection.
  .then(function () {
    return run("4. Can it reach the host at all", function () {
      return fetch(API + "/api/health", { mode: "no-cors" })
        .then(function (r) { return "reached it (opaque, type=" + r.type + ")"; });
    });
  });

  document.getElementById("copy").onclick = function () {
    var t = document.getElementById("out");
    t.select(); t.setSelectionRange(0, 99999);
    try { document.execCommand("copy"); this.textContent = "Copied"; }
    catch (err) { this.textContent = "Select the text above and copy"; }
  };
})();
</script>
</body>
</html>
